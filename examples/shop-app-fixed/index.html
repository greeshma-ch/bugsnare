<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shop App</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        margin: 0 auto;
        max-width: 40rem;
        padding: 2rem 1rem;
        color: #111;
      }
      h1 {
        font-size: 1.5rem;
      }
      ul.products {
        list-style: none;
        display: flex;
        gap: 2rem;
        padding: 0;
      }
      li.product {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 1rem;
      }
      button {
        font: inherit;
        padding: 0.4rem 0.75rem;
        cursor: pointer;
      }
      ul.cart {
        list-style: none;
        padding: 0;
      }
      li.cart-item {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.5rem 0;
        border-bottom: 1px solid #eee;
      }
      input[type="number"] {
        width: 4rem;
        font: inherit;
        padding: 0.2rem 0.4rem;
      }
      #total {
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>Shop</h1>

    <ul class="products">
      <li class="product">
        <h2>Widget</h2>
        <p>Price: $10</p>
        <button type="button" data-add="widget">Add Widget</button>
      </li>
      <li class="product">
        <h2>Gadget</h2>
        <p>Price: $25</p>
        <button type="button" data-add="gadget">Add Gadget</button>
      </li>
    </ul>

    <h2>Cart</h2>
    <p id="cart-empty">Your cart is empty.</p>
    <ul class="cart" id="cart"></ul>

    <p>
      Subtotal:
      <span id="subtotal">$0</span>
    </p>

    <p>
      Total:
      <span id="total" role="status">$0</span>
    </p>

    <section class="discount">
      <h2>Discount</h2>
      <label for="discount-code">Discount code</label>
      <input id="discount-code" type="text" autocomplete="off" />
      <button type="button" id="apply-discount">Apply discount</button>
      <p id="discount-message"></p>
    </section>

    <p><a id="checkout-link" href="checkout.html">Checkout</a></p>

    <script>
      const PRODUCTS = {
        widget: { name: "Widget", price: 10 },
        gadget: { name: "Gadget", price: 25 },
      };

      const DISCOUNT_CODES = {
        SAVE10: { code: "SAVE10", percent: 10 },
      };

      /** @type {{ id: string, name: string, price: number, quantity: number }[]} */
      const cart = [];
      let nextLineId = 1;
      let appliedDiscount = null;

      const cartEl = document.getElementById("cart");
      const emptyEl = document.getElementById("cart-empty");
      const totalEl = document.getElementById("total");
      const subtotalEl = document.getElementById("subtotal");
      const discountInput = document.getElementById("discount-code");
      const discountButton = document.getElementById("apply-discount");
      const discountMessage = document.getElementById("discount-message");

      function formatPrice(amount) {
        // Money is rendered without trailing zeros ("$10", "$31.5"), so a figure
        // derived by plain arithmetic matches what the page displays.
        return "$" + String(Number(amount.toFixed(2)));
      }

      function discountAmount(subtotal) {
        if (!appliedDiscount) return 0;

        // FIXED: the seeded bug subtracted a flat $10 instead of the code's
        // percentage, so a $35 cart dropped to $25 rather than $31.5.
        return (subtotal * appliedDiscount.percent) / 100;
      }

      function updateTotal() {
        // FIXED: the seeded bug summed only the unit price and ignored
        // `item.quantity`, so 3 x $10 Widget showed $10 instead of $30.
        const subtotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
        const total = subtotal - discountAmount(subtotal);

        subtotalEl.textContent = formatPrice(subtotal);
        totalEl.textContent = formatPrice(total);
      }

      function applyDiscount() {
        const code = discountInput.value.trim().toUpperCase();

        if (!code) {
          appliedDiscount = null;
          discountMessage.textContent = "Enter a discount code.";
          updateTotal();
          return;
        }

        if (!DISCOUNT_CODES[code]) {
          appliedDiscount = null;
          discountMessage.textContent = "That discount code is not valid.";
          updateTotal();
          return;
        }

        appliedDiscount = DISCOUNT_CODES[code];
        discountMessage.textContent = "Discount " + appliedDiscount.code + " applied.";
        updateTotal();
      }

      function createCartItem(item) {
        const li = document.createElement("li");
        li.className = "cart-item";
        li.dataset.lineId = item.id;

        const label = document.createElement("span");
        label.textContent = item.name;

        const quantity = document.createElement("input");
        quantity.type = "number";
        quantity.min = "1";
        quantity.step = "1";
        quantity.value = String(item.quantity);
        quantity.setAttribute("aria-label", "Quantity for " + item.name);
        quantity.addEventListener("input", () => {
          const parsed = Number.parseInt(quantity.value, 10);
          item.quantity = Number.isNaN(parsed) ? 1 : Math.max(1, parsed);
          updateTotal();
        });

        const linePrice = document.createElement("span");
        linePrice.textContent = formatPrice(item.price);

        li.append(label, quantity, linePrice);
        return li;
      }

      function addToCart(productKey) {
        const product = PRODUCTS[productKey];
        if (!product) return;

        const item = {
          id: String(nextLineId++),
          name: product.name,
          price: product.price,
          quantity: 1,
        };
        cart.push(item);

        emptyEl.hidden = true;
        cartEl.append(createCartItem(item));
        updateTotal();
      }

      document.querySelectorAll("button[data-add]").forEach((button) => {
        button.addEventListener("click", () => addToCart(button.dataset.add));
      });

      discountButton.addEventListener("click", applyDiscount);

      // A known code applies as soon as it is typed, so the discount works
      // whether the shopper types it or presses "Apply discount".
      discountInput.addEventListener("input", () => {
        const code = discountInput.value.trim().toUpperCase();
        if (DISCOUNT_CODES[code]) applyDiscount();
      });

      updateTotal();
    </script>
  </body>
</html>
